name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  tests:
    name: Frappe Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install bench
        run: pip install frappe-bench

      # Versions are PINNED, not tracked. `version-15` is a moving branch, and it
      # moved: erpnext v15.119 changed the signature of the regional hook
      # `get_regional_round_off_accounts(company, account_list)` to take a third
      # `doc` argument, which india_compliance v15.30.1 does not accept. Every
      # Sales Invoice save then died with a TypeError that enrolment swallowed —
      # 23 of 45 modules red, for a reason nothing in this repo had changed.
      # These are the versions development actually runs against.
      - name: Init bench
        run: |
          bench init \
            --skip-redis-config-generation \
            --frappe-branch v15.97.0 \
            frappe-bench
          cd frappe-bench
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host redis://localhost:13000
          bench set-redis-queue-host redis://localhost:11000

      - name: Install ERPNext
        run: |
          cd frappe-bench
          bench get-app erpnext --branch v15.95.0

      - name: Install netgainz
        run: |
          cd frappe-bench
          bench get-app netgainz ${{ github.workspace }}

      - name: Install India Compliance + payments
        run: |
          cd frappe-bench
          # India Compliance pinned (needs frappe>=15.50 / erpnext>=15.60); payments
          # provides the Payment Gateway doctype the test-record sweep needs.
          #
          # india_compliance v15.31.0+ accepts the third `doc` argument, so moving
          # BOTH forward together is the other valid pairing — but that is an
          # upgrade decision, not a CI fix, and it has to happen on Frappe Cloud
          # first. payments has no tags to pin to.
          bench get-app https://github.com/resilient-tech/india-compliance --branch v15.30.1
          bench get-app https://github.com/frappe/payments --branch version-15

      - name: Create test site
        run: |
          cd frappe-bench
          bench new-site test.localhost \
            --db-root-password root \
            --admin-password admin \
            --install-app erpnext \
            --install-app payments \
            --install-app india_compliance \
            --install-app netgainz

      - name: Run tests
        run: |
          cd frappe-bench
          # Run per-module, NOT `run-tests --app netgainz`. With india_compliance
          # installed, frappe's app-wide make_test_records sweep tries to build
          # ERPNext fixtures (Payment Gateway Account, Item Tax Template, ...) that
          # india_compliance's GST validations reject — failures unrelated to
          # NetGainz. Per-module runs build only each module's own deps and pass.
          #
          # Every module runs even after one fails. The step used to abort on the
          # first failure (`bash -e`), so a single red module hid the other forty —
          # for weeks CI only ever ran `test_permissions` and stopped there.
          modules=$(cd apps/netgainz && find netgainz -name 'test_*.py' | sort | sed 's#/#.#g; s#\.py$##')
          failed=""
          for m in $modules; do
            echo "::group::$m"
            if ! bench --site test.localhost run-tests --module "$m"; then
              failed="$failed $m"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing modules:$failed"
            for m in $failed; do echo "  - $m"; done
            exit 1
          fi
          echo "All $(echo "$modules" | wc -l) test modules passed."
