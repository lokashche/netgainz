name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  tests:
    name: Frappe Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init \
            --skip-redis-config-generation \
            --frappe-branch version-15 \
            frappe-bench
          cd frappe-bench
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host redis://localhost:13000
          bench set-redis-queue-host redis://localhost:11000

      - name: Install ERPNext
        run: |
          cd frappe-bench
          bench get-app erpnext --branch version-15

      - name: Install netgainz
        run: |
          cd frappe-bench
          bench get-app netgainz ${{ github.workspace }}

      - name: Create test site
        run: |
          cd frappe-bench
          bench new-site test.localhost \
            --db-root-password root \
            --admin-password admin \
            --install-app erpnext \
            --install-app netgainz

      - name: Install coverage
        run: |
          cd frappe-bench
          ./env/bin/pip install coverage

      - name: Run tests
        run: |
          cd frappe-bench
          bench --site test.localhost run-tests --app netgainz --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frappe-bench/sites/.coverage
